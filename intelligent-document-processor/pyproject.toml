[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-document-processor"
version = "0.1.0"
description = "RAG ingestion pipeline: PDF/DOCX/HTML/MD -> structured content, chunking comparison with RAGAS, FastAPI Q&A"
requires-python = ">=3.10"


dependencies = [
    "langchain>=0.3.0,<0.4.0",
    "langchain-core>=0.3.85,<0.4.0",
    "langchain-community>=0.3.0,<0.4.0",
    "langchain-openai>=0.2.0,<0.4.0",
    "langchain-qdrant>=0.1.4,<1.0.0",
    "qdrant-client>=1.9.0",
    "ragas>=0.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]
[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
